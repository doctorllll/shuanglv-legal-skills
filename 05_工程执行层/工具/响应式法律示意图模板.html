<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>法律关系示意图</title>
<style>
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#fff;color:#111827}
  .wrap{max-width:980px;margin:auto;padding:18px}.head{margin-bottom:12px}.head h1{font-size:20px;margin:0 0 6px}.head p{font-size:13px;color:#4b5563;margin:0}
  .card{border:1px solid #d1d5db;border-radius:12px;padding:10px;overflow:auto;background:#fff}
  svg{width:100%;min-width:640px;height:auto}.node{fill:#fff;stroke:#374151;stroke-width:1.5}.label{font-size:15px;font-weight:600;fill:#111827}.sub{font-size:12px;fill:#4b5563}.edge{stroke:#4b5563;stroke-width:1.6;fill:none}.edge.dashed{stroke-dasharray:7 5}.edge.dotted{stroke-dasharray:2 5}.edge-label{font-size:12px;fill:#374151}
  .legend{font-size:12px;color:#4b5563;margin-top:10px}.actions{margin:12px 0}.actions button{padding:8px 12px;border:1px solid #9ca3af;border-radius:8px;background:#fff;cursor:pointer}
  @media(max-width:720px){.wrap{padding:12px}.card{padding:6px}svg{min-width:560px}.head h1{font-size:18px}}
</style>
</head>
<body><div class="wrap">
<div class="head"><h1>交易关系示意图（模板）</h1><p>纯文本模型可直接修改下方 SVG 节点与连线；无需外部网络。</p></div>
<div class="actions"><button onclick="savePng()">导出 PNG</button></div>
<div class="card">
<svg id="diagram" viewBox="0 0 900 430" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker></defs>
<!-- 节点：纯文本模型按 DiagramSpec 修改 -->
<rect class="node" x="70" y="90" width="210" height="82" rx="10"/><text class="label" x="175" y="122" text-anchor="middle">甲公司</text><text class="sub" x="175" y="146" text-anchor="middle">采购方</text>
<rect class="node" x="620" y="90" width="210" height="82" rx="10"/><text class="label" x="725" y="122" text-anchor="middle">乙公司</text><text class="sub" x="725" y="146" text-anchor="middle">供应方</text>
<rect class="node" x="345" y="300" width="210" height="82" rx="10"/><text class="label" x="450" y="332" text-anchor="middle">丙公司</text><text class="sub" x="450" y="356" text-anchor="middle">加工方</text>
<!-- 关系：实线=已核验，虚线=主张/待核验，点线=推断 -->
<path class="edge" d="M280 120 L620 120" marker-end="url(#arrow)"/><text class="edge-label" x="450" y="108" text-anchor="middle">支付价款</text>
<path class="edge" d="M620 150 L280 150" marker-end="url(#arrow)"/><text class="edge-label" x="450" y="170" text-anchor="middle">交付 / 安装 / 验收</text>
<path class="edge dashed" d="M620 172 Q590 255 555 315" marker-end="url(#arrow)"/><text class="edge-label" x="610" y="250">委托加工（待核验）</text>
</svg>
</div>
<div class="legend">图例：实线＝已核验；虚线＝当事人主张/待核验；点线＝分析推断。实际项目应以 DiagramSpec 与来源定位为准。</div>
</div>
<script>
function savePng(){
 const svg=document.getElementById('diagram'); const xml=new XMLSerializer().serializeToString(svg);
 const blob=new Blob([xml],{type:'image/svg+xml;charset=utf-8'}); const url=URL.createObjectURL(blob); const img=new Image();
 img.onload=()=>{const vb=svg.viewBox.baseVal; const scale=2; const c=document.createElement('canvas'); c.width=vb.width*scale;c.height=vb.height*scale;const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);ctx.scale(scale,scale);ctx.drawImage(img,0,0);URL.revokeObjectURL(url);c.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='法律关系示意图.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)},'image/png')}; img.src=url;
}
</script></body></html>
