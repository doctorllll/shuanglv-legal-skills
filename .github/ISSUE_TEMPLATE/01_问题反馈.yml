name: 问题反馈
description: 规则表述有误 / 文档链接失效 / 门控过严过松 / 某平台加载不了入口 / Schema 或配置问题
title: "[问题] "
labels: ["问题反馈"]
body:
  - type: markdown
    attributes:
      value: |
        **请勿粘贴任何真实案件信息**；举例请用"张三 / 李四 / 某某公司"占位。真实使用中的失败请用「真实失败反馈」模板。
  - type: dropdown
    id: area
    attributes:
      label: 涉及范围
      options:
        - 00_使用与调度（入口 / 路由 / 对抗性审查 / 人工升级 / 分析推理 / 溯源 / 回写 等规范）
        - 01_运行规范（能力契约 / 外部能力适配 / 降级）
        - 02_公共接口 / 数据结构
        - 03_技能 · 法律研究与多源资料融合
        - 03_技能 · 刑事案件办理
        - 03_技能 · 民商事争议解决
        - 03_技能 · 合同与交易工作
        - 03_技能 · 法律顾问与专项法律分析
        - 03_技能 · 尽职调查与专项调查
        - 03_技能 · 法律文书质量与格式控制
        - 03_技能 · 多模态输入适配（可选）
        - 04_使用示例
        - 05_工程执行层（执行器 / 配置 / 规则）
        - 平台安装 / 加载
        - README / CONTRIBUTING / 仓库层
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: 问题是什么
      description: 哪个文件、哪一条规则 / 步骤 / 字段，出了什么问题
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: 为什么是问题
  - type: textarea
    id: expected
    attributes:
      label: 建议怎么改，依据是什么
      description: 涉及业务规则的，请附专业依据（法条 / 司法解释 / 实务惯例 / 反例）
  - type: input
    id: platform
    attributes:
      label: Agent 平台与版本（如与平台相关）
  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 本 Issue 不含任何真实案件信息
          required: true
